[project]
name = "logforge"
version = "0.1.0"
description = "A Python-based log analysis and monitoring tool designed for developers and support engineers."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Przemyslaw Senderski" }
]
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/logforge"]


[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"


[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"


[tool.pytest.ini_options]
testpaths = [
    "tests"
]